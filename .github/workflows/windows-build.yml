name: Windows build

# Builds, tests and packages DoodleNook for Windows x64 as a self-contained portable app,
# then starts the packaged app once (smoke test) and uploads it as the "DoodleNook-win-x64" artifact.
on:
  push:
    branches: [ "iteration/004-the-missing-ink" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  windows:
    name: Build, test and package (win-x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DoodleNook.slnx

      - name: Build (Release)
        run: dotnet build DoodleNook.slnx -c Release --no-restore

      - name: Run automated tests
        run: dotnet test DoodleNook.slnx -c Release --no-build --logger "trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Publish self-contained Windows app
        run: >
          dotnet publish src/DoodleNook.App/DoodleNook.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false
          -p:PublishReadyToRun=true -p:DebugType=none -o publish/DoodleNook

      - name: Add read-me and licences
        shell: pwsh
        run: |
          Copy-Item packaging/README-FIRST.txt publish/DoodleNook/
          Copy-Item THIRD-PARTY-NOTICES.txt publish/DoodleNook/

      - name: Verify the package contents
        shell: pwsh
        run: |
          $dir = "publish/DoodleNook"
          $required = "DoodleNook.exe", "libSkiaSharp.dll", "libHarfBuzzSharp.dll", "av_libglesv2.dll", "README-FIRST.txt", "THIRD-PARTY-NOTICES.txt"
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing from package: $f" }
          }
          if (Get-ChildItem $dir -Filter *.pdb) { throw "Debug symbols should not be shipped" }
          $exe = Get-Item (Join-Path $dir "DoodleNook.exe")
          if ($exe.Length -lt 20MB) { throw "DoodleNook.exe is unexpectedly small ($($exe.Length) bytes) - not self-contained?" }
          Get-ChildItem $dir | Format-Table Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}} -AutoSize

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/DoodleNook/* -DestinationPath DoodleNook-win-x64.zip -CompressionLevel Optimal

      - name: Smoke test - start the app from the extracted ZIP
        shell: pwsh
        run: |
          Expand-Archive DoodleNook-win-x64.zip -DestinationPath zip-check
          $out = Join-Path $PWD "smoke-test"
          $p = Start-Process -FilePath "zip-check/DoodleNook.exe" -ArgumentList "--smoke-test", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "The app did not finish its smoke test within 3 minutes" }
          if (Test-Path "$out/smoke-report.json") { Get-Content "$out/smoke-report.json" } else { Write-Host "No report written" }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }
          Write-Host "Smoke test passed: the packaged DoodleNook.exe started, drew, saved and reopened a PNG."

      - name: Upload DoodleNook-win-x64
        uses: actions/upload-artifact@v7
        with:
          # GitHub delivers an artifact as a .zip, so the verified app folder is uploaded directly:
          # downloading "DoodleNook-win-x64" gives DoodleNook-win-x64.zip with DoodleNook.exe at its top level.
          name: DoodleNook-win-x64
          path: publish/DoodleNook/
          if-no-files-found: error

      - name: Upload test and smoke-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/
            smoke-test/
          if-no-files-found: ignore
