<title>DoodleNook Workspace Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Varela+Round&display=swap">
<style>
/* Layout: a cool "lab" control bar (the playground) above a stage of simulated screens; inside each
   screen sits the warm DoodleNook prototype, laid out in true logical pixels for the chosen display. */
:root {
  color-scheme: dark;
  /* playground (lab) — deliberately cool so it never reads as part of DoodleNook */
  --lab-bg: #0f1317;
  --lab-s1: #161c22;
  --lab-s2: #1e262e;
  --lab-line: #2b3640;
  --lab-text: #dde5ec;
  --lab-mute: #8f9ba7;
  --lab-acc: #82c6ff;
  --lab-acc-ink: #08141f;
  --lab-good: #7fd39b;
  --lab-ok: #f3c56b;
  --lab-bad: #ff8a7a;
  --font-lab: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Segoe UI Variable Text", "Segoe UI", "Inter", system-ui, sans-serif;
  --font-brand: "Varela Round", "Segoe UI", "Inter", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--lab-bg); color: var(--lab-text);
  font: 13px/1.4 var(--font-lab); display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body.present { padding: 0; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--lab-acc); outline-offset: 2px; }

/* ---------------------------------------------------------------- lab bar */
.lab { flex: none; display: flex; flex-direction: column; gap: 8px; padding-block: 10px 8px; border-bottom: 1px solid var(--lab-line); }
body.present .lab { display: none; }
.lab-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
.lab-brand { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.lab-brand b { font: 15px var(--font-brand); letter-spacing: .01em; }
.lab-brand span { color: var(--lab-mute); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.lab-label { color: var(--lab-mute); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.seg { display: inline-flex; background: var(--lab-s1); border: 1px solid var(--lab-line); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--lab-mute); white-space: nowrap; }
.seg button:hover { color: var(--lab-text); }
.seg button[aria-pressed="true"] { background: var(--lab-s2); color: var(--lab-text); box-shadow: inset 0 0 0 1px var(--lab-line); }
.seg.ws button[aria-pressed="true"] { background: var(--lab-acc); color: var(--lab-acc-ink); box-shadow: none; }
.seg.ws b { font-weight: 700; margin-right: 4px; }
.lab-field { display: inline-flex; align-items: center; gap: 6px; }
.lab select { background: var(--lab-s1); border: 1px solid var(--lab-line); border-radius: 8px; padding: 5px 8px; }
.lab-btn { background: var(--lab-s1); border: 1px solid var(--lab-line); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.lab-btn:hover { border-color: var(--lab-acc); }
.lab-btn.primary { background: var(--lab-acc); color: var(--lab-acc-ink); border-color: var(--lab-acc); font-weight: 600; }
.lab-chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--lab-mute); }
.lab-chk input { accent-color: var(--lab-acc); width: 15px; height: 15px; }
.lab-chk:has(input:checked) { color: var(--lab-text); }
.spacer { flex: 1; }

/* ---------------------------------------------------------------- stage & screens */
.stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; gap: 28px; padding-block: 14px; overflow: hidden; }
body.present .stage { padding: 0; }
.frame { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.frame-box { position: relative; border-radius: 10px; box-shadow: 0 0 0 7px #05080b, 0 0 0 8px #2b3640, 0 20px 50px rgba(0,0,0,.55); background: #000; }
body.present .frame-box { border-radius: 0; box-shadow: none; }
.screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; border-radius: 3px; }
.frame-cap { color: var(--lab-mute); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; max-width: 100%; }
.frame-cap b { color: var(--lab-text); font-weight: 600; }
body.present .frame-cap { display: none; }
.express { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 5px; }
.express i { display: block; width: 8px; height: 8px; border-radius: 50%; background: #2b3640; }
.express i.long { height: 18px; border-radius: 4px; }
body.present .express { display: none; }

/* desktop (dual) wallpaper + windows */
.desk { position: absolute; inset: 0; background: radial-gradient(120% 90% at 20% 10%, #33404d, #1a2129 60%, #12171c); }
.desk-note { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); background: rgba(10,14,18,.8); color: var(--lab-text); border: 1px solid var(--lab-line); border-radius: 10px; padding: 10px 16px; font: 22px var(--font-lab); white-space: nowrap; }
.desk-ref { position: absolute; border-radius: 10px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.5); background: #f8f4ec; }
.desk-ref .cap { position: absolute; left: 0; right: 0; top: 0; height: 34px; background: #2a2622; color: #d9cfc4; font: 15px var(--font-ui); display: flex; align-items: center; padding: 0 12px; }

/* ---------------------------------------------------------------- trial bar, chip, toasts, drawer, help */
.trialbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 12px; background: var(--lab-s2); border: 1px solid var(--lab-acc); border-radius: 12px; padding: 8px 10px 8px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100% - 20px); }
.trialbar .tb-step { color: var(--lab-mute); font-size: 12px; white-space: nowrap; }
.trialbar .tb-msg { font-weight: 600; }
.lab-chip { position: fixed; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--lab-s2); color: var(--lab-text); border: 1px solid var(--lab-acc); border-radius: 999px; padding: 7px 14px; cursor: pointer; opacity: .85; }
.lab-chip:hover { opacity: 1; }
.toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: var(--lab-s2); border: 1px solid var(--lab-line); color: var(--lab-text); padding: 8px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.45); max-width: min(560px, 90vw); text-align: center; animation: toastIn .18s ease-out; }
.toast .k { color: var(--lab-acc); font-weight: 600; }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } }
.drawer { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--lab-s1); border-left: 1px solid var(--lab-line); box-shadow: -20px 0 40px rgba(0,0,0,.45); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--lab-line); }
.drawer header h2 { font: 600 16px var(--font-lab); margin: 0; flex: 1; }
.drawer .tabs { display: flex; gap: 4px; padding: 10px 16px 0; }
.drawer .tabs button { flex: 1; background: transparent; border: 1px solid var(--lab-line); border-bottom: 0; border-radius: 9px 9px 0 0; padding: 8px 6px; cursor: pointer; color: var(--lab-mute); }
.drawer .tabs button[aria-selected="true"] { background: var(--lab-s2); color: var(--lab-text); }
.drawer .body { flex: 1; overflow: auto; padding: 16px; background: var(--lab-s2); margin: 0 16px; border: 1px solid var(--lab-line); border-radius: 0 0 10px 10px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.drawer .foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; }
.drawer h3 { margin: 0; font: 600 15px var(--font-lab); text-wrap: balance; }
.drawer p { margin: 0; color: var(--lab-mute); max-width: 62ch; }
.drawer .how { color: var(--lab-text); }
.res { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
.res th, .res td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--lab-line); vertical-align: middle; }
.res th { color: var(--lab-mute); font-weight: 500; }
.stars { display: inline-flex; gap: 2px; }
.stars button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--lab-line); background: transparent; cursor: pointer; color: var(--lab-mute); padding: 0; font-size: 12px; }
.stars button.on { background: var(--lab-acc); color: var(--lab-acc-ink); border-color: var(--lab-acc); }
.note { font-size: 12px; color: var(--lab-mute); border-left: 3px solid var(--lab-line); padding-left: 10px; }
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(4,7,10,.72); display: flex; align-items: center; justify-content: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.modal-card { background: var(--lab-s1); border: 1px solid var(--lab-line); border-radius: 14px; width: min(860px, 100%); max-height: 100%; overflow: auto; padding: 22px 24px; display: grid; gap: 14px; }
.modal-card h2 { margin: 0; font: 22px var(--font-brand); }
.modal-card h3 { margin: 4px 0 0; font: 600 14px var(--font-lab); color: var(--lab-acc); text-transform: uppercase; letter-spacing: .06em; }
.modal-card p, .modal-card li { color: var(--lab-text); max-width: 72ch; }
.modal-card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.modal-card .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 24px; }
.kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border: 1px solid var(--lab-line); border-bottom-width: 2px; border-radius: 5px; font: 12px var(--font-lab); text-align: center; background: var(--lab-s2); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; align-items: center; }

/* ================================================================ DoodleNook app (inside screens) */
.dn, .deskwin {
  --ui: #24201d; --ui2: #2c2724; --ui3: #37312c; --line: #3e3732; --tx: #efe7dd; --tx2: #a99d91;
  --acc: #e9a94d; --acc-ink: #22180c; --acc-soft: rgba(233,169,77,.17); --surround: #181513;
  --paper-shadow: 0 10px 34px rgba(0,0,0,.5); --pop-shadow: 0 14px 34px rgba(0,0,0,.5);
  --btn: 36px; --bar: 40px; --fs: 13px; --icon: 19px; --dock: 264px; --pad: 7px; --rad: 9px; --sw: 96px;
}
.dn[data-theme="paper"], .deskwin[data-theme="paper"] {
  --ui: #f1ebe3; --ui2: #faf6f0; --ui3: #e6ddd2; --line: #dacfc2; --tx: #2c2520; --tx2: #786b60;
  --acc: #c26f17; --acc-ink: #fffaf2; --acc-soft: rgba(194,111,23,.13); --surround: #ddd5ca;
  --paper-shadow: 0 8px 26px rgba(60,40,20,.18); --pop-shadow: 0 12px 30px rgba(60,40,20,.22);
}
.dn[data-theme="graphite"], .deskwin[data-theme="graphite"] {
  --ui: #1f2226; --ui2: #272b30; --ui3: #32373d; --line: #3a4047; --tx: #e6e9ec; --tx2: #98a0a8;
  --acc: #74b4ea; --acc-ink: #0b1620; --acc-soft: rgba(116,180,234,.16); --surround: #15171a;
}
.dn[data-density="compact"], .deskwin[data-density="compact"] { --btn: 30px; --bar: 34px; --fs: 12px; --icon: 17px; --dock: 236px; --pad: 5px; --rad: 7px; --sw: 84px; }
.dn[data-density="pen"], .deskwin[data-density="pen"] { --btn: 44px; --bar: 50px; --fs: 14px; --icon: 22px; --dock: 300px; --pad: 9px; --rad: 11px; --sw: 112px; }

.dn { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surround); color: var(--tx); font: var(--fs)/1.35 var(--font-ui); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
.ic { width: var(--icon); height: var(--icon); fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.dn .b { height: var(--btn); min-width: var(--btn); border: 0; border-radius: var(--rad); background: transparent; color: var(--tx); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; cursor: pointer; white-space: nowrap; flex: none; position: relative; }
.dn .b.sq { padding: 0; width: var(--btn); }
.dn .b:hover { background: var(--ui3); }
.dn .b.on { background: var(--acc-soft); color: var(--acc); }
.dn .b.tool.on, .dn .b.solid.on { background: var(--acc); color: var(--acc-ink); }
.dn .b .lbl { color: var(--tx2); }
.dn .b.ghost { color: var(--tx2); }
.dn .sep { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line); flex: none; }
.dn .grow { flex: 1; min-width: 0; }

/* title bar */
.dn-title { flex: none; height: var(--bar); display: flex; align-items: center; gap: 4px; background: var(--ui); border-bottom: 1px solid var(--line); padding: 0 4px 0 10px; min-width: 0; }
.dn-brand { display: flex; align-items: center; gap: 7px; font: 15px var(--font-brand); margin-right: 8px; white-space: nowrap; }
.dn-brand .mark { width: calc(var(--icon) + 4px); height: calc(var(--icon) + 4px); }
.dn-menu { display: flex; gap: 0; min-width: 0; overflow: hidden; }
.dn-menu .b { height: calc(var(--bar) - 8px); padding: 0 9px; color: var(--tx); }
.dn-doc { color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
.dn-win { display: flex; }
.dn-win .b { color: var(--tx2); border-radius: 6px; }
.wsw { display: inline-flex; gap: 2px; background: var(--ui2); border: 1px solid var(--line); border-radius: calc(var(--rad) + 2px); padding: 2px; flex: none; }
.wsw .b { height: calc(var(--bar) - 12px); min-width: calc(var(--bar) - 12px); padding: 0 6px; }
.wsw .b.on { background: var(--acc); color: var(--acc-ink); }
.wsw .b .nm { font-weight: 600; }

/* options / context bar */
.dn-opts { flex: none; min-height: var(--bar); display: flex; align-items: center; gap: 8px; background: var(--ui2); border-bottom: 1px solid var(--line); padding: 3px 10px; overflow: hidden; min-width: 0; }
.dn-opts .tname { font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.dn-opts .hint { color: var(--tx2); white-space: nowrap; }
.preset-chip { display: inline-flex; align-items: center; gap: 8px; height: var(--btn); padding: 0 8px; border-radius: var(--rad); background: var(--ui3); border: 0; color: var(--tx); cursor: pointer; white-space: nowrap; flex: none; }
.preset-chip svg.pv { width: 44px; height: calc(var(--btn) - 12px); }
.colour-chip { width: calc(var(--btn) - 6px); height: calc(var(--btn) - 6px); border-radius: 50%; border: 2px solid var(--tx); cursor: pointer; flex: none; padding: 0; box-shadow: 0 0 0 2px var(--ui2); }

/* sliders */
.sl { display: inline-flex; align-items: center; gap: 8px; height: var(--btn); flex: none; }
.sl .sl-name { color: var(--tx2); white-space: nowrap; }
.sl .sl-track { position: relative; width: var(--sw); height: var(--btn); cursor: pointer; touch-action: none; margin: 0 calc(var(--btn) * .22); }
.sl .sl-rail { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--ui3); }
.sl .sl-fill { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--acc); }
.sl .sl-knob { position: absolute; top: 50%; width: calc(var(--btn) * .42); height: calc(var(--btn) * .42); margin: calc(var(--btn) * -.21) 0 0 calc(var(--btn) * -.21); border-radius: 50%; background: var(--tx); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.sl .sl-val { min-width: 40px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* main area */
.dn-main { flex: 1; min-height: 0; display: flex; position: relative; }
.dn[data-hand="left"] .dn-main { flex-direction: row-reverse; }
.dn-strip { flex: none; width: calc(var(--btn) + var(--pad) * 2); background: var(--ui); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: var(--pad) 0; overflow: hidden; }
.dn[data-hand="left"] .dn-strip { border-right: 0; border-left: 1px solid var(--line); }
.dn-strip .b.tool .grp { position: absolute; right: 3px; bottom: 3px; width: 0; height: 0; border-left: 4px solid transparent; border-bottom: 4px solid currentColor; opacity: .6; }
.fgbg { position: relative; width: var(--btn); height: var(--btn); margin-top: auto; flex: none; }
.fgbg .bgc, .fgbg .fgc { position: absolute; width: 62%; height: 62%; border-radius: 5px; border: 2px solid var(--tx); cursor: pointer; padding: 0; }
.fgbg .fgc { left: 0; top: 0; z-index: 1; }
.fgbg .bgc { right: 0; bottom: 0; }
.dn-canvas { flex: 1; position: relative; min-width: 0; overflow: hidden; background: var(--surround); }
.dn-dock { flex: none; width: var(--dock); background: var(--ui2); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.dn[data-hand="left"] .dn-dock { border-left: 0; border-right: 1px solid var(--line); }
.dn-dock.collapsed { width: calc(var(--btn) + var(--pad) * 2); align-items: center; padding: var(--pad) 0; gap: 4px; }
.dock-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 2px 12px; height: calc(var(--btn) + 4px); color: var(--tx2); border-bottom: 1px solid var(--line); flex: none; }
.dock-scroll { flex: 1; min-height: 0; overflow: auto; }
.sec { border-bottom: 1px solid var(--line); }
.sec-h { width: 100%; display: flex; align-items: center; gap: 8px; height: calc(var(--btn) - 2px); padding: 0 10px; background: transparent; border: 0; color: var(--tx); cursor: pointer; font-weight: 600; }
.sec-h .ic { width: calc(var(--icon) - 3px); height: calc(var(--icon) - 3px); color: var(--tx2); }
.sec-h .chev { margin-left: auto; transition: transform .15s; }
.sec.closed .sec-h .chev { transform: rotate(-90deg); }
.sec-b { padding: 4px 10px 12px; }
.sec.closed .sec-b { display: none; }
.dn-status { flex: none; height: calc(var(--bar) - 8px); display: flex; align-items: center; gap: 12px; padding: 0 10px; background: var(--ui); border-top: 1px solid var(--line); color: var(--tx2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.dn-status .b { height: calc(var(--bar) - 12px); min-width: calc(var(--bar) - 12px); }

/* colour picker */
.cp { display: grid; gap: 8px; }
.cp-sv { position: relative; width: 100%; aspect-ratio: 1.45; border-radius: 6px; cursor: crosshair; touch-action: none; max-width: 100%; }
.cp-sv .k { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; }
.cp-hue { position: relative; height: calc(var(--btn) * .55); border-radius: 6px; background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); cursor: pointer; touch-action: none; }
.cp-hue .k { position: absolute; top: -3px; bottom: -3px; width: 8px; margin-left: -4px; border-radius: 4px; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: calc(var(--btn) * .72); height: calc(var(--btn) * .72); border-radius: 50%; border: 1px solid rgba(0,0,0,.35); cursor: pointer; padding: 0; flex: none; }
.cp-row { display: flex; align-items: center; gap: 8px; color: var(--tx2); font-variant-numeric: tabular-nums; }

/* brush presets */
.brushes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.btile { display: grid; gap: 2px; padding: 6px; border-radius: var(--rad); background: var(--ui); border: 1px solid transparent; color: var(--tx); cursor: pointer; text-align: left; min-height: var(--btn); }
.btile.on { border-color: var(--acc); background: var(--acc-soft); }
.btile svg { width: 100%; height: 26px; }
.btile span { font-size: calc(var(--fs) - 1px); color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btile.on span { color: var(--tx); }

/* layers */
.layers { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.lrow { display: flex; align-items: center; gap: 8px; min-height: var(--btn); padding: 2px 6px 2px 2px; border-radius: var(--rad); cursor: pointer; border: 1px solid transparent; }
.lrow:hover { background: var(--ui3); }
.lrow.on { background: var(--acc-soft); border-color: color-mix(in srgb, var(--acc) 55%, transparent); }
.lrow .eye { width: var(--btn); height: var(--btn); border: 0; background: transparent; color: var(--tx); border-radius: var(--rad); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.lrow .eye.off { color: var(--tx2); opacity: .55; }
.lrow .thumb { width: calc(var(--btn) * 1.35); height: calc(var(--btn) * .84); border-radius: 4px; background: #f8f4ec; overflow: hidden; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.lrow .thumb svg, .lrow .thumb canvas { width: 100%; height: 100%; display: block; }

function makeFrames() {
  const W = 24, H = 24, frames = [];
  const WISP = [0, -1, -1, 0, 1, 1];
  for (let f = 0; f < 4; f++) {
    const a = new Uint8Array(W * H);
    SPRITE_ROWS.forEach((row, y) => { for (let x = 0; x < W; x++) a[y * W + x] = SPRITE_KEY[row[x] || '.'] || 0; });
    for (let r = 0; r < 5; r++) {
      const y = 2 + r;
      a[y * W + 7 + WISP[(r + f) % 6]] = 3;
      if (r > 0) a[y * W + 12 + WISP[(r + f + 3) % 6]] = 3;
    }
    frames.push(a);
  }
  return frames;
}

  if (ctrl) return;
  if (k === 'Enter' && S.trial && S.trial.exp === 'C') { e.preventDefault(); trialDone(); return; }
  if (k === '?') { openHelp(); return; }
  const low = k.toLowerCase();
  if (low === 'r' && S.ws !== 'E') { KEYS.r = true; return; }
  if (low === 'q') { if (lastAppPt) openRadial(lastAppPt.x, lastAppPt.y, false); else ACTIONS.radialhere(); return; }
  if (k === '[' || k === ']') {
    if (S.ws === 'E') { S.pix.size = clamp(S.pix.size + (k === ']' ? 1 : -1), 1, 3); render(); return; }
    setSize(curSize() * (k === ']' ? 1.15 : 1 / 1.15)); syncSliders(); ghostSize(); pill(); trialCheck(); return;
  }
  if (low === 'x') { if (S.ws === 'E') ACTIONS.pxswap(); else ACTIONS.swap(); return; }
  if (low === 'd') { if (S.ws !== 'E') { S.fg = '#000000'; S.bg = '#ffffff'; render(); } return; }
  const map = S.ws === 'E' ? PX_KEYS : PS_KEYS;
  if (map[low]) {
    const t = map[low];
    if (S.ws === 'A' && !['brush', 'pencil', 'eraser', 'eyedropper', 'hand'].includes(t)) { toast(`${TOOLS[t].name} isn't part of Pure Sketch.`); return; }
    if (S.ws !== 'A' && TOOLSETS[S.ws] && !TOOLSETS[S.ws].includes(t)) { toast(`${TOOLS[t].name} isn't in the ${WS[S.ws].name} toolbar.`); return; }
    setTool(t);
  }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'Alt') { KEYS.alt = false; e.preventDefault(); }
  if (e.key === ' ') { KEYS.space = false; vpArt.classList.remove('pan-ready'); vpPix.classList.remove('pan-ready'); }
  if (e.key.toLowerCase() === 'r') KEYS.r = false;
});
window.addEventListener('blur', () => { KEYS.alt = KEYS.space = KEYS.r = false; });

/* =================================================================== experiments (trials) */
const EXP = {
  A: { title: 'Reaching your tools', modes: [['toolbar', 'Permanent toolbar'], ['radial', 'Quick palette at the pen']],
    what: 'Compares reaching a small permanent toolbar with summoning a quick palette where the pen already is.',
    how: 'Each round: tap the orange dot, then switch to the tool named in the prompt. In palette mode the toolbar is hidden: right-click or press the pen\'s side button to open the palette, then tap or flick to the tool.' },
  B: { title: 'Accessing layers', modes: [['dock', 'Permanent dock'], ['popover', 'Pop-over'], ['strip', 'Slim layer strip']],
    what: 'Compares a docked Layers panel, a pop-over you open and close, and a slim strip of layer thumbnails at the screen edge.',
    how: 'Each round: tap the orange dot, then do the layer task in the prompt (hide, show or select a layer).' },
  C: { title: 'Adjusting the brush', modes: [['drag', 'Alt + drag on canvas'], ['radial', 'Palette centre dial'], ['slider', 'Toolbar slider'], ['keys', '[ and ] keys']],
    what: 'Compares ways of changing brush size. Every method shows the same circle at the pen so you can judge the size where you draw.',
    how: 'Match the brush to the dashed target circle, then press Done (or Enter). Three rounds per run. Alt + drag also changes hardness when you move up or down. A Kamvas express key can be set to Alt.' },
};
function trackTravel(e) {
  const T = S.trial;
  if (!T || T.done) return;
  const x = e.clientX / mainScale, y = e.clientY / mainScale;
  if (T.last) T.travel += Math.hypot(x - T.last.x, y - T.last.y);
  T.last = { x, y };
}
function startTrial(exp, mode) {
  closeDrawer();
  if (exp === 'A') { S.toolMode = mode; if (!['B', 'C', 'D'].includes(S.ws)) switchWs('B'); }
  if (exp === 'B') { S.layerMode = mode; if (!['B', 'C', 'D'].includes(S.ws)) switchWs('C'); S.layers.forEach((l) => { if (['lines', 'shading', 'colour', 'doodles'].includes(l.id)) l.visible = true; }); S.active = 'doodles'; }
  if (exp === 'C') { S.sizeMethod = mode; if (S.ws === 'E') switchWs('B'); if (!isPaint()) setTool('brush'); }
  S.uiHidden[S.ws] = false;
  const steps = [];
  if (exp === 'A') { const seq = ['eraser', 'eyedropper', 'brush', 'pencil', 'eraser', 'brush']; let prev = tool(); for (const t of seq) { steps.push({ tool: t === prev ? 'eyedropper' : t }); prev = steps[steps.length - 1].tool; } }
  if (exp === 'B') steps.push({ act: 'hide', id: 'lines', msg: 'Hide the <b>Lines</b> layer' }, { act: 'select', id: 'shading', msg: 'Make <b>Shading</b> the active layer' }, { act: 'show', id: 'lines', msg: 'Show the <b>Lines</b> layer again' }, { act: 'select', id: 'doodles', msg: 'Make <b>Doodles</b> the active layer' });
  if (exp === 'C') { const pool = [10, 22, 48, 90, 160].sort(() => Math.random() - 0.5); for (let i = 0; i < 3; i++) steps.push({ target: pool[i] }); }
  S.trial = { exp, mode, steps, i: 0, phase: exp === 'C' ? 'do' : 'tap', t0: performance.now(), travel: 0, last: null, errs: [], dot: null };
  render();
  nextTrialStep(true);
}
function nextTrialStep(first) {
  const T = S.trial;
  if (!first) T.i++;
  if (T.i >= T.steps.length) return finishTrial();
  if (T.exp === 'C') { T.phase = 'do'; T.stepT0 = performance.now(); setSize(T.i === 0 ? 30 : curSize()); syncSliders(); }
  else { T.phase = 'tap'; placeDot(); }
  renderTrialBar(); drawTrialTarget();
}
function placeDot() {
  const a = $('#canvasArea', app);
  const w = a.clientWidth, h = a.clientHeight;
  S.trial.dot = { x: 70 + Math.random() * Math.max(10, w - 140), y: 90 + Math.random() * Math.max(10, h - 160) };
}
function trialTap(p) {
  const T = S.trial; if (!T || T.phase !== 'tap' || !T.dot) return;
  if (Math.hypot(p.x - T.dot.x, p.y - T.dot.y) < 30) { T.phase = 'do'; T.dot = null; drawTrialTarget(); renderTrialBar(); trialCheck(); }
}
function trialCheck() {
  const T = S.trial; if (!T || T.phase !== 'do') return;
  const st = T.steps[T.i];
  if (T.exp === 'A' && tool() === st.tool) return nextTrialStep();
  if (T.exp === 'B') {
    const l = S.layers.find((x) => x.id === st.id);
    if ((st.act === 'hide' && l && !l.visible) || (st.act === 'show' && l && l.visible) || (st.act === 'select' && S.active === st.id)) return nextTrialStep();
  }
  if (T.exp === 'C') drawTrialTarget();
}
function trialDone() {
  const T = S.trial; if (!T || T.exp !== 'C') return;
  const st = T.steps[T.i];
  T.errs.push(Math.abs(curSize() - st.target) / st.target);
  nextTrialStep();
}
function drawTrialTarget() {
  $$('.trial-dot, .trial-tgt', vpArt).forEach((x) => x.remove());
  const T = S.trial; if (!T) return;
  if (T.dot) { const d = document.createElement('div'); d.className = 'trial-dot'; d.style.left = T.dot.x + 'px'; d.style.top = T.dot.y + 'px'; vpArt.appendChild(d); }
  if (T.exp === 'C' && T.phase === 'do') {
    const st = T.steps[T.i]; const c = vpCenter();
    const el = document.createElement('div'); el.className = 'sizehud trial-tgt'; el.style.cssText = 'left:0;top:0';
    const td = st.target * S.view.z, cd = curSize() * S.view.z;
    el.innerHTML = `<div class="tgt" style="left:${c.x}px;top:${c.y}px;width:${td}px;height:${td}px"></div><div class="ring" style="left:${c.x}px;top:${c.y}px;width:${cd}px;height:${cd}px"></div>`;
    vpArt.appendChild(el);
  }
}
function renderTrialBar() {
  let bar = $('#trialBar');
  const T = S.trial;
  if (!T) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.className = 'trialbar'; bar.id = 'trialBar'; document.body.appendChild(bar); }
  const E = EXP[T.exp];
  const modeName = E.modes.find((m) => m[0] === T.mode)[1];
  let msg = '';
  if (T.phase === 'tap') msg = 'Tap the <span style="color:#ff8a3d">orange dot</span> on the canvas';
  else if (T.exp === 'A') msg = `Now switch to <b>${TOOLS[T.steps[T.i].tool].name}</b>`;
  else if (T.exp === 'B') msg = T.steps[T.i].msg;
  else msg = `Match the dashed circle (${T.steps[T.i].target} px) using <b>${modeName}</b>`;
  bar.style.position = 'fixed';
  bar.style.top = (S.present ? 10 : Math.round(stage.getBoundingClientRect().top + 8)) + 'px';
  bar.innerHTML = `<span class="tb-step">${E.title} · ${modeName} · ${T.i + 1}/${T.steps.length}</span><span class="tb-msg">${msg}</span>${T.exp === 'C' ? '<button class="lab-btn primary" id="tbDone" type="button">Done</button>' : ''}<button class="lab-btn" id="tbCancel" type="button">Cancel</button>`;
  $('#tbCancel', bar).onclick = cancelTrial;
  const d = $('#tbDone', bar); if (d) d.onclick = trialDone;
}
function finishTrial() {
  const T = S.trial;
  const secs = (performance.now() - T.t0) / 1000;
  const mm = T.travel * mmPerLogical(appScreenKey());
  const r = { secs, perStep: secs / T.steps.length, mm, err: T.errs.length ? T.errs.reduce((a, b) => a + b, 0) / T.errs.length : null, screen: appScreenKey(), density: S.density, hand: S.hand, at: new Date().toISOString() };
  (S.results[T.exp][T.mode] = S.results[T.exp][T.mode] || []).push(r);
  if (T.exp === 'A') S.toolMode = 'auto';
  if (T.exp === 'B') S.layerMode = 'auto';
  S.trial = null; save();
  renderTrialBar(); drawTrialTarget();
  render();
  toast(`Run recorded: ${secs.toFixed(1)} s · about ${Math.round(mm)} mm of pen travel. Rate how it felt in Experiments.`);
  openDrawer(T.exp);
}
function cancelTrial() {
  const T = S.trial; if (!T) return;
  if (T.exp === 'A') S.toolMode = 'auto';
  if (T.exp === 'B') S.layerMode = 'auto';
  S.trial = null; renderTrialBar(); drawTrialTarget(); render();
  toast('Trial cancelled.');
}

/* =================================================================== drawer & help */
const drawer = $('#drawer');
function openDrawer(tab) { if (tab) S.drawerTab = tab; drawer.hidden = false; renderDrawer(); }
function closeDrawer() { drawer.hidden = true; }
function renderDrawer() {
  const t = S.drawerTab, E = EXP[t];
  const res = S.results[t] || {};
  const rows = E.modes.map(([m, name]) => {
    const runs = res[m] || [];
    const avg = (f) => runs.length ? runs.reduce((a, r) => a + r[f], 0) / runs.length : null;
    const rating = S.ratings[t][m] || 0;
    return `<tr><td>${name}</td><td>${runs.length}</td><td>${avg('perStep') != null ? avg('perStep').toFixed(1) + ' s' : '—'}</td><td>${avg('mm') != null ? Math.round(avg('mm')) + ' mm' : '—'}</td>${t === 'C' ? `<td>${avg('err') != null ? Math.round(avg('err') * 100) + '%' : '—'}</td>` : ''}
      <td><span class="stars">${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="${rating >= n ? 'on' : ''}" data-rate="${t}|${m}|${n}" aria-label="Feels ${n} of 5">${n}</button>`).join('')}</span></td></tr>`;
  }).join('');
  drawer.innerHTML = `<header><h2>Experiments</h2><button class="lab-btn" id="drClose" type="button">Close</button></header>
    <div class="tabs" role="tablist">${Object.entries(EXP).map(([k, x]) => `<button role="tab" aria-selected="${k === t}" data-tab="${k}" type="button">${k} · ${x.title}</button>`).join('')}</div>
    <div class="body">
      <h3>${E.title}</h3>
      <p>${E.what}</p>
      <p class="how">${E.how}</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${E.modes.map(([m, name]) => `<button class="lab-btn primary" type="button" data-start="${t}|${m}">Try: ${name}</button>`).join('')}</div>
      <table class="res"><thead><tr><th>Method</th><th>Runs</th><th>Per step</th><th>Pen travel</th>${t === 'C' ? '<th>Size error</th>' : ''}<th>How it felt (1–5)</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">No method is declared the winner. Time and travel are rough signals; how it felt matters more. Pen travel is measured in the simulated screen and converted to millimetres on the ${S.screen === 'desk' ? '27″ monitor' : 'Kamvas 13'} at the chosen scaling. With “Try on this screen” on the Kamvas itself, the numbers are close to real.</p>
    </div>
    <div class="foot"><button class="lab-btn primary" id="drCopy" type="button">Copy my results</button><button class="lab-btn" id="drReset" type="button">Clear results</button></div>
    <textarea id="drText" hidden style="margin:0 16px 16px;height:140px;background:var(--lab-s2);color:var(--lab-text);border:1px solid var(--lab-line);border-radius:8px;padding:8px" aria-label="Results text"></textarea>`;
  $('#drClose').onclick = closeDrawer;
  $$('[data-tab]', drawer).forEach((b) => { b.onclick = () => { S.drawerTab = b.dataset.tab; renderDrawer(); }; });
  $$('[data-start]', drawer).forEach((b) => { b.onclick = () => { const [x, m] = b.dataset.start.split('|'); startTrial(x, m); }; });
  $$('[data-rate]', drawer).forEach((b) => { b.onclick = () => { const [x, m, n] = b.dataset.rate.split('|'); S.ratings[x][m] = +n; save(); renderDrawer(); }; });
  $('#drCopy').onclick = copyResults;
  $('#drReset').onclick = () => { S.results = { A: {}, B: {}, C: {} }; S.ratings = { A: {}, B: {}, C: {} }; save(); renderDrawer(); toast('Results cleared.'); };
}
function resultsText() {
  const L = [`DoodleNook playground results · ${new Date().toLocaleString()}`, `Screen: ${appScreenKey()} · density ${S.density} · ${S.hand}-handed · look ${S.theme}`, ''];
  for (const [k, E] of Object.entries(EXP)) {
    L.push(`Experiment ${k} — ${E.title}`);
    for (const [m, name] of E.modes) {
      const runs = (S.results[k] || {})[m] || [];
      const rt = S.ratings[k][m];
      if (!runs.length && !rt) { L.push(`  ${name}: not tried`); continue; }
      const avg = (f) => runs.length ? runs.reduce((a, r) => a + (r[f] || 0), 0) / runs.length : 0;
      L.push(`  ${name}: ${runs.length} run(s) · ${avg('perStep').toFixed(1)} s per step · ~${Math.round(avg('mm'))} mm pen travel${k === 'C' && runs.length ? ` · ${Math.round(avg('err') * 100)}% size error` : ''} · felt ${rt ? rt + '/5' : 'not rated'}`);

  }

}
function copyResults() {
  const text = resultsText();
  const ta = $('#drText');
  const fallback = () => { ta.hidden = false; ta.value = text; ta.focus(); ta.select(); toast('Copy the selected text (Ctrl+C).'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Results copied. Paste them into your notes or chat.'), fallback);
  else fallback();
}
drawer.addEventListener('click', (e) => e.stopPropagation());

const help = $('#help');
function openHelp() {

    <div style="display:flex;align-items:center;gap:12px"><h2 style="flex:1">DoodleNook workspace playground</h2><button class="lab-btn" id="helpClose" type="button">Close</button></div>
    <p>This is a disposable design prototype for trying interface ideas. It is not DoodleNook and has no real painting engine. The canvas uses a tiny demo ink so that brush size, cursors and palettes have something to show.</p>
    <div class="cols">
      <div><h3>The bar at the top is the playground</h3><ul>
        <li><b>Workspace</b> switches between the five concepts (also <span class="kbd">Alt</span>+<span class="kbd">1</span>–<span class="kbd">5</span>).</li>
        <li><b>Screen</b> lays the interface out in the real logical pixels of the Kamvas 13 at 100/125/150%, a 27″ monitor, or both side by side.</li>
        <li><b>Density</b> changes button and text size. <b>Hand</b> mirrors the layout.</li>
        <li><b>Canvas room</b> measures the drawing area. <b>Pen target sizes</b> colours every control by its size in millimetres on that screen. <b>What works</b> outlines the controls that respond.</li>
        <li><b>Try on this screen</b> hides the playground bar and fills the window. Run it full-screen on the Kamvas to feel the layout at real size.</li></ul></div>
      <div><h3>Drawing on the prototype</h3><ul>
        <li>Pen pressure works in browsers that support it (Windows Ink).</li>
        <li><b>Right-click</b> or the <b>pen's side button</b> opens the quick palette at the pen. Tap an item, or press and flick toward it. Drag the centre up or down to change size. <span class="kbd">Q</span> also opens it (prototype only).</li>
        <li><span class="kbd">Alt</span> + drag on the canvas: left/right for size, up/down for hardness.</li>
        <li><span class="kbd">Tab</span> hides or shows the interface. In Pure Sketch it returns to your previous workspace.</li>
        <li>Everything you draw lands on the <b>Doodles</b> layer and can be undone.</li></ul></div>
      <div><h3>Photoshop-style keys</h3><div class="keys">
        <span><span class="kbd">B</span> <span class="kbd">N</span> <span class="kbd">E</span> <span class="kbd">I</span></span><span>Brush, pencil, eraser, eyedropper</span>
        <span><span class="kbd">M</span> <span class="kbd">L</span> <span class="kbd">H</span> <span class="kbd">Z</span></span><span>Select, lasso, hand, zoom</span>
        <span><span class="kbd">[</span> <span class="kbd">]</span></span><span>Smaller / larger brush</span>
        <span><span class="kbd">X</span> <span class="kbd">D</span></span><span>Swap / default colours</span>
        <span><span class="kbd">Space</span> drag</span><span>Pan</span>
        <span><span class="kbd">R</span> drag</span><span>Rotate the view (Shift snaps 15°)</span>
        <span><span class="kbd">Ctrl</span>+<span class="kbd">Z</span></span><span>Undo (<span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">Z</span> redo)</span>
        <span>Mouse wheel</span><span>Zoom</span></div></div>
      <div><h3>Kamvas express keys worth trying</h3><ul>
        <li>Undo · Tab (hide interface) · E (eraser) · Alt (size drag) · Space (pan) · R (rotate) · [ and ].</li>
        <li>Set one side button to right-click to open the quick palette without the keyboard.</li></ul>
        <h3>What is simulated</h3><ul><li>Menus, adjustments, history, many tools and selection actions only show a note. The demo ink, layers visibility, colour picking, brush sizes, the radial palette and the pixel editor respond.</li></ul></div>
    </div></div>`;
  $('#helpClose').onclick = closeHelp;
  help.onclick = (e) => { if (e.target === help) closeHelp(); };
}
function closeHelp() { help.hidden = true; }

/* =================================================================== toasts */
function toast(html) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html;
  const box = $('#toasts'); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 3400);
}

/* =================================================================== lab controls */
function segButtons(el, items, cur, onPick) {
  el.innerHTML = items.map(([v, label]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${label}</button>`).join('');
  el.onclick = (e) => { const b = e.target.closest('button'); if (b) onPick(b.dataset.v); };
}
function updateLabControls() {
  segButtons($('#segWs'), Object.entries(WS).map(([k, w]) => [k, `<b>${k}</b><span class="nm">${w.name}</span>`]), S.ws, (v) => switchWs(v));
  segButtons($('#segDensity'), [['compact', 'Compact'], ['standard', 'Standard'], ['pen', 'Pen']], S.density, (v) => { S.density = v; S.vpSize = null; save(); render(); });
  segButtons($('#segHand'), [['right', 'Right'], ['left', 'Left']], S.hand, (v) => { S.hand = v; S.vpSize = null; save(); layoutStage(); });
  segButtons($('#segContent'), [['sample', 'Sample'], ['empty', 'Empty']], S.content, (v) => { S.content = v; save(); render(); });
  $('#selScreen').value = S.screen; $('#selTheme').value = S.theme;
  $('#ovArea').checked = S.ov.area; $('#ovTargets').checked = S.ov.targets; $('#ovLive').checked = S.ov.live;
}
$('#selScreen').onchange = (e) => { S.screen = e.target.value; S.vpSize = null; save(); layoutStage(); };
$('#selTheme').onchange = (e) => { S.theme = e.target.value; save(); render(); };
$('#ovArea').onchange = (e) => { S.ov.area = e.target.checked; save(); renderOverlays(); };
$('#ovTargets').onchange = (e) => { S.ov.targets = e.target.checked; save(); renderOverlays(); };
$('#ovLive').onchange = (e) => { S.ov.live = e.target.checked; save(); render(); if (S.ov.live) toast('Dashed outlines mark controls that respond. Faded controls only show a note.'); };
$('#btnExp').onclick = () => (drawer.hidden ? openDrawer() : closeDrawer());
$('#btnHelp').onclick = openHelp;
$('#btnTry').onclick = enterPresent;
$('#labChip').onclick = exitPresent;
function enterPresent() {
  S.present = true; S.prevScreen = S.screen; S.screen = 'live'; S.vpSize = null;
  document.body.classList.add('present'); $('#labChip').hidden = false; closeDrawer();
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  setTimeout(layoutStage, 60);
  toast('Real-size mode. The playground bar is hidden; use the button at the bottom-left (or Esc) to bring it back.');
}
function exitPresent() {
  S.present = false; S.screen = S.prevScreen && S.prevScreen !== 'live' ? S.prevScreen : 'kam150'; S.vpSize = null;
  document.body.classList.remove('present'); $('#labChip').hidden = true;
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  setTimeout(layoutStage, 60);
}
document.addEventListener('fullscreenchange', () => { if (S.present) setTimeout(layoutStage, 80); });
let rsz = 0;
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { S.vpSize = null; layoutStage(); }, 120); });

/* =================================================================== boot */
load();
initPix();
buildPersistent();
layoutStage();
if (window.location.hash && /^#ws-[a-e]$/i.test(window.location.hash)) switchWs(window.location.hash.slice(4).toUpperCase());
window.__dn = { S, switchWs, layoutStage, render, openRadial, setTool, startTrial, renderOverlays };
})();
</script>
